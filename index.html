<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#151515">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Frameboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#eee;font:14px system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;overflow:hidden;display:grid;grid-template-rows:58px 1fr}
button,input{font:inherit}button{cursor:pointer}
.top{display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid #292929;background:#151515}
.logo{font-size:18px;font-weight:700}.tabs{display:flex;gap:6px}
.tab,.btn{background:#202020;color:#bbb;border:1px solid #383838;border-radius:7px;padding:8px 12px}
.tab.active{background:#2b2b2b;color:#fff}.btn:hover,.tab:hover{background:#2b2b2b;color:#fff}
.primary{background:#eee;color:#111;border-color:#eee}.primary:hover{background:#fff;color:#111}.danger{color:#ff9999}
.ws{display:grid;grid-template-columns:270px 1fr;min-height:0}.ws.story{grid-template-columns:1fr}
.side{background:#171717;border-right:1px solid #292929;padding:14px;display:flex;flex-direction:column;min-height:0;min-width:0}
.sidehead{display:flex;align-items:center;gap:8px;margin-bottom:12px}.sidehead strong{margin-right:auto}
.tree{overflow:auto;min-height:0}
.folder{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:7px;color:#bbb;cursor:pointer;user-select:none}
.folder:hover,.folder.active,.over{background:#292929;color:#fff}
.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{color:#666;font-size:11px}.acts{display:none}.folder:hover .acts{display:inline-flex}.folder:hover .count{display:none}
.acts button{padding:2px 5px;background:none;border:0;color:#aaa}.acts button:hover{color:#fff}
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.toolbar{min-height:58px;border-bottom:1px solid #242424;padding:10px 16px;display:flex;gap:8px;align-items:center}
.crumb{margin-right:auto;font-weight:600}.crumb a{color:#9bb;cursor:pointer}.crumb a:hover{text-decoration:underline}
.search{width:220px;background:#191919;color:#fff;border:1px solid #353535;border-radius:7px;padding:9px 11px}
.pane{padding:18px;overflow:auto;min-height:0;flex:1}
.drop{border:1px dashed #444;border-radius:10px;padding:14px;text-align:center;color:#888;margin-bottom:16px}.drop.drag{border-color:#aaa;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:15px;margin-bottom:18px}
.ftile{display:flex;justify-content:space-between;align-items:center;background:#191919;border:1px solid #2d2d2d;border-radius:10px;padding:14px;cursor:pointer}
.ftile:hover{background:#262626}
.card{position:relative;background:#191919;border:1px solid #2d2d2d;border-radius:10px}
.thumb{width:100%;aspect-ratio:16/10;display:block;object-fit:cover;background:#0b0b0b;border-radius:10px 10px 0 0}
.meta{padding:9px}.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.small{font-size:11px;color:#777;margin-top:4px}
.more{position:absolute;right:7px;top:7px}.more>button{width:32px;height:32px;border-radius:50%;border:1px solid #555;background:#000b;color:#fff}
.menu{position:absolute;right:0;top:38px;background:#202020;border:1px solid #444;border-radius:8px;z-index:20;min-width:170px;box-shadow:0 10px 30px #000a}
.menu button{display:block;width:100%;border:0;background:none;color:#eee;text-align:left;padding:10px 12px}.menu button:hover{background:#303030}
.empty{border:1px dashed #3a3a3a;border-radius:10px;color:#777;padding:60px 20px;text-align:center}
.story{display:grid;grid-template-columns:230px 1fr;min-height:0}
.boards{background:#171717;border-right:1px solid #292929;padding:14px;overflow:auto}
.boarditem{padding:9px;border-radius:7px;color:#bbb;cursor:pointer}.boarditem.active,.boarditem:hover{background:#292929;color:#fff}
.canvasarea{min-width:0;min-height:0;display:flex;flex-direction:column}
.storytoolbar{height:58px;border-bottom:1px solid #292929;display:flex;align-items:center;gap:8px;padding:0 14px}
.canvas{flex:1;overflow:auto;background:#0b0b0b;padding:28px}
.board{position:relative;width:1200px;height:675px;background:#fff;margin:0 auto;overflow:hidden;box-shadow:0 12px 50px #0008}
.storyitem{position:absolute;min-width:30px;min-height:30px}.storyitem.selected{z-index:5}
.boarditem-img{width:100%;height:100%;display:block;cursor:move;user-select:none;object-fit:fill;border:2px solid transparent}
.storyitem.selected .boarditem-img{border-color:#111;outline:2px solid #fff}
.resize-handle{position:absolute;width:10px;height:10px;background:#111;border:2px solid #fff;border-radius:2px;display:none;z-index:3}
.storyitem.selected .resize-handle{display:block}
.resize-nw{left:-6px;top:-6px;cursor:nwse-resize}.resize-ne{right:-6px;top:-6px;cursor:nesw-resize}
.resize-sw{left:-6px;bottom:-6px;cursor:nesw-resize}.resize-se{right:-6px;bottom:-6px;cursor:nwse-resize}
.boardempty{color:#888;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:100}
.dialog{width:min(520px,calc(100% - 30px));background:#1c1c1c;border:1px solid #444;border-radius:12px;padding:20px}
.dialog h2{margin:0 0 8px}.dialog p{color:#bbb;line-height:1.45;margin:0;white-space:pre-line}
.dialog input{width:100%;background:#111;color:#fff;border:1px solid #444;border-radius:7px;padding:10px;margin-top:10px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.pickl{max-height:320px;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:4px}.pickl .btn{text-align:left}
.pickg{max-height:340px;overflow:auto;margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.pickg img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent}.pickg img:hover{border-color:#fff}
.hidden,[hidden]{display:none!important}
.filepick{position:relative;display:inline-flex}
</style>
</head>
<body>
<header class="top"><div class="logo">Frameboard</div><div class="tabs"><button class="tab active" id="libraryTab" onclick="showView('library')">Image Library</button><button class="tab" id="storyboardTab" onclick="showView('storyboard')">Storyboard</button></div></header>
<div class="ws" id="ws">
<aside class="side" id="librarySide"><div class="sidehead"><strong>Folders</strong><button class="btn primary" id="newFolder" title="Creates a folder inside the folder you have open">＋ Folder</button></div><div class="tree" id="tree"></div></aside>
<main class="main" id="libraryMain"><div class="toolbar"><div class="crumb" id="crumb"></div><input class="search" id="search" placeholder="Search images…"><button class="btn primary" id="addImagesBtn">＋ Add Images Here</button><input id="fileInput" type="file" accept="image/*" multiple hidden></div><div class="pane"><div class="drop" id="drop">Drop images here to add them to the open folder, or paste with Ctrl/Cmd+V.</div><div id="gallery"></div></div></main>
<section class="story" id="storyView" hidden><aside class="boards"><div class="sidehead"><strong>Boards</strong><button class="btn primary" id="newBoard">＋</button></div><div id="boardList"></div></aside><div class="canvasarea"><div class="storytoolbar"><strong id="boardName">Storyboard</strong><span style="margin-right:auto"></span><button class="btn" id="addFromLibrary">＋ From Library</button><button class="btn" id="pasteStory">Paste Image</button><button class="btn danger" id="removeSel">Remove Selected</button></div><div class="canvas" id="canvas"><div class="board" id="board"></div></div></div></section>
</div>
<div class="modal" id="modal"><div class="dialog"><h2 id="mt"></h2><p id="mx"></p><input id="mi" class="hidden" maxlength="100"><div id="mb"></div><div class="actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="ok">OK</button></div></div></div>
<script>
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,cur='root',bd=null,sel=null,closeModal=null;

/* ---------- storage ---------- */
const tx=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const getAll=s=>rq(tx(s).getAll()),put=(s,v)=>rq(tx(s,'readwrite').put(v)),del=(s,id)=>rq(tx(s,'readwrite').delete(id));
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open('frameboard',1);
r.onupgradeneeded=()=>{for(const s of ['folders','images','boards','items'])if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})};
r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
async function seed(){
 if(!(await getAll('folders')).length){await put('folders',{id:'root',name:'All Images',parent:null,system:true});await put('folders',{id:'unsorted',name:'Unsorted',parent:'root',system:true})}
 const old=localStorage.getItem('frameboard-library-v3');
 if(old){try{for(const x of JSON.parse(old))await put('images',{id:x.id,name:x.name,blob:x.src,folder:'unsorted',created:x.created||Date.now()});localStorage.removeItem('frameboard-library-v3')}catch(e){}}
 if(!(await getAll('boards')).length){const b={id:uid(),name:'Storyboard 1',created:Date.now()};await put('boards',b);bd=b.id}
}

/* ---------- modal ---------- */
function modal(title,text,o={}){return new Promise(res=>{
 const m=$('#modal'),inp=$('#mi'),body=$('#mb');
 $('#mt').textContent=title;$('#mx').textContent=text||'';
 inp.classList.toggle('hidden',!o.input);inp.value=o.initial||'';
 body.innerHTML='';if(o.body)body.appendChild(o.body);
 $('#ok').classList.toggle('hidden',!!o.noOk);
 m.style.display='flex';
 const done=v=>{m.style.display='none';closeModal=null;res(v)};
 closeModal=done;
 $('#ok').onclick=()=>done(o.input?inp.value.trim():true);
 $('#cancel').onclick=()=>done(null);
 inp.onkeydown=e=>{if(e.key==='Enter')$('#ok').click();if(e.key==='Escape')done(null)};
 if(o.input)setTimeout(()=>{inp.focus();inp.select()},30);
})}

/* ---------- folder helpers ---------- */
const kids=(fs,p)=>fs.filter(f=>f.parent===p);
const desc=(fs,id)=>kids(fs,id).flatMap(k=>[k.id,...desc(fs,k.id)]);
function pathOf(fs,id){const p=[];let f=fs.find(x=>x.id===id);while(f&&f.id!=='root'){p.unshift(f);f=fs.find(x=>x.id===f.parent)}return p}
const label=(fs,id)=>pathOf(fs,id).map(f=>f.name).join(' / ');

/* ---------- library ---------- */
async function renderAll(){
 const [fs,ims]=await Promise.all([getAll('folders'),getAll('images')]);
 if(!fs.find(f=>f.id===cur))cur='root';
 renderTree(fs,ims);renderGallery(fs,ims);
}
function renderTree(fs,ims){
 const n={};ims.forEach(i=>n[i.folder]=(n[i.folder]||0)+1);
 const t=$('#tree');t.innerHTML='';
 const row=(f,d)=>{
  const r=document.createElement('div');r.className='folder'+(cur===f.id?' active':'');r.dataset.fid=f.id;r.style.paddingLeft=(9+d*16)+'px';
  const real=!f.system;
  r.innerHTML=`<span class="fname">${kids(fs,f.id).length?'▾':'▸'} ${esc(f.name)}</span><span class="count">${f.id==='root'?ims.length:n[f.id]||0}</span>`+
   (real?'<span class="acts"><button data-a="sub" title="New subfolder">＋</button><button data-a="ren" title="Rename">✎</button><button data-a="del" title="Delete folder">🗑</button></span>':'');
  r.onclick=async e=>{
   const a=e.target.dataset.a;
   if(a==='sub')return newFolder(f.id);
   if(a==='ren'){const v=await modal('Rename folder','',{input:1,initial:f.name});if(v){f.name=v;await put('folders',f);renderAll()}return}
   if(a==='del')return delFolder(f,fs,ims);
   cur=f.id;renderAll();
  };
  t.appendChild(r);
  kids(fs,f.id).sort((a,b)=>a.name.localeCompare(b.name)).forEach(k=>row(k,d+1));
 };
 const root=fs.find(f=>f.id==='root');if(root)row(root,0);
}
function renderGallery(fs,ims){
 const q=$('#search').value.toLowerCase();
 $('#crumb').innerHTML='<a data-go="root">All Images</a>'+pathOf(fs,cur).map(f=>` / <a data-go="${f.id}">${esc(f.name)}</a>`).join('');
 const cnt=id=>{const ids=[id,...desc(fs,id)];return ims.filter(i=>ids.includes(i.folder)).length};
 const subs=q?[]:kids(fs,cur).sort((a,b)=>a.name.localeCompare(b.name));
 let show=cur==='root'?ims:ims.filter(i=>i.folder===cur);
 if(q)show=ims.filter(i=>i.name.toLowerCase().includes(q));
 let h='';
 if(subs.length)h+='<div class="grid">'+subs.map(f=>`<div class="ftile" data-fid="${f.id}"><span>▰ ${esc(f.name)}</span><span class="count">${cnt(f.id)}</span></div>`).join('')+'</div>';
 h+=show.length?'<div class="grid">'+show.map(i=>`<article class="card" draggable="true" data-id="${i.id}"><img class="thumb" src="${i.blob}"><div class="meta"><div class="name" title="${esc(i.name)}">${esc(i.name)}</div><div class="small">${esc(label(fs,i.folder)||'All Images')} · ${new Date(i.created).toLocaleDateString()}</div></div><div class="more"><button>⋮</button><div class="menu" hidden><button data-a="move">Move to…</button><button data-a="ren">Rename</button><button data-a="del" class="danger">Delete from Library</button></div></div></article>`).join('')+'</div>':(subs.length?'':'<div class="empty">No images here yet.</div>');
 const g=$('#gallery');g.innerHTML=h;
 g.onclick=e=>{const t=e.target.closest('.ftile');if(t){cur=t.dataset.fid;renderAll()}};
 g.querySelectorAll('.card').forEach(c=>{
  const id=c.dataset.id,im=ims.find(x=>x.id===id),menu=c.querySelector('.menu');
  c.ondragstart=e=>e.dataTransfer.setData('text/plain',id);
  c.querySelector('.more>button').onclick=e=>{e.stopPropagation();const was=menu.hidden;closeMenus();menu.hidden=!was};
  menu.onclick=async e=>{
   const a=e.target.dataset.a;if(!a)return;closeMenus();
   if(a==='del'){if(await modal('Delete image?','This removes it from the Image Library. Existing storyboard placements stay intact.')){await del('images',id);renderAll()}}
   if(a==='ren'){const v=await modal('Rename image','',{input:1,initial:im.name});if(v){im.name=v;await put('images',im);renderAll()}}
   if(a==='move'){
    const l=document.createElement('div');l.className='pickl';
    fs.filter(f=>f.id!=='root').sort((a,b)=>label(fs,a.id).localeCompare(label(fs,b.id))).forEach(f=>{const b=document.createElement('button');b.className='btn';b.textContent=label(fs,f.id);b.onclick=()=>closeModal(f.id);l.appendChild(b)});
    const dest=await modal('Move to…','',{body:l,noOk:1});
    if(dest){im.folder=dest;await put('images',im);renderAll()}
   }
  };
 });
}
const closeMenus=()=>document.querySelectorAll('.menu').forEach(m=>m.hidden=true);
document.addEventListener('click',closeMenus);
$('#crumb').onclick=e=>{const g=e.target.dataset.go;if(g){cur=g;renderAll()}};

async function newFolder(parent){
 const fs=await getAll('folders');
 const p=parent||(cur==='unsorted'?'root':cur);
 const where=p==='root'?'at the top level':'inside "'+label(fs,p)+'"';
 const n=await modal('New folder','This folder will be created '+where+'.',{input:1});
 if(!n)return;
 await put('folders',{id:uid(),name:n,parent:p,system:false});
 renderAll();
}
async function delFolder(f,fs,ims){
 if(!await modal('Delete folder?','"'+f.name+'" will be removed. Its images move to Unsorted and its subfolders move up one level.'))return;
 for(const i of ims.filter(i=>i.folder===f.id)){i.folder='unsorted';await put('images',i)}
 for(const k of kids(fs,f.id)){k.parent=f.parent;await put('folders',k)}
 await del('folders',f.id);
 if(cur===f.id)cur=f.parent||'root';
 renderAll();
}
async function importFiles(list){
 const files=[...list].filter(f=>f&&f.type&&f.type.startsWith('image/'));
 if(!files.length){alert('Please choose one or more image files.');return}
 for(const f of files)await put('images',{id:uid(),name:f.name||('Image '+Date.now()),blob:await toData(f),folder:cur==='root'?'unsorted':cur,created:Date.now()});
 renderAll();
}
const toData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function moveDrop(id,fid){
 const im=(await getAll('images')).find(x=>x.id===id);if(!im)return;
 im.folder=fid==='root'?'unsorted':fid;await put('images',im);renderAll();
}

/* ---------- storyboard ---------- */
async function renderBoards(){
 const bs=await getAll('boards');if(!bd&&bs[0])bd=bs[0].id;
 const l=$('#boardList');l.innerHTML=bs.map(b=>`<div class="boarditem ${b.id===bd?'active':''}" data-id="${b.id}">${esc(b.name)}</div>`).join('');
 l.querySelectorAll('.boarditem').forEach(x=>x.onclick=()=>{bd=x.dataset.id;sel=null;renderStory()});
 return bs;
}
async function renderStory(){
 const bs=await renderBoards();
 $('#boardName').textContent=bs.find(x=>x.id===bd)?.name||'Storyboard';
 const items=(await getAll('items')).filter(x=>x.boardId===bd),board=$('#board');
 board.innerHTML='';
 if(!items.length){board.innerHTML='<div class="boardempty">Your storyboard is empty.<br>Use “From Library” or paste an image.</div>';return}
 for(const it of items){
  const w=document.createElement('div');w.className='storyitem'+(it.id===sel?' selected':'');
  Object.assign(w.style,{left:it.x+'px',top:it.y+'px',width:it.w+'px',height:it.h+'px'});
  const img=document.createElement('img');img.className='boarditem-img';img.src=it.blob;img.draggable=false;w.appendChild(img);
  for(const d of ['nw','ne','sw','se']){const h=document.createElement('div');h.className='resize-handle resize-'+d;w.appendChild(h);resizable(h,w,it,d)}
  draggable(w,it);board.appendChild(w);
 }
}
function select(el,it){document.querySelectorAll('.storyitem').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');sel=it.id}
function draggable(el,it){let sx,sy,ox,oy,pid=null;
 el.onpointerdown=e=>{if(e.target.classList.contains('resize-handle'))return;e.preventDefault();pid=e.pointerId;el.setPointerCapture(pid);sx=e.clientX;sy=e.clientY;ox=it.x;oy=it.y;select(el,it)};
 el.onpointermove=e=>{if(pid!==e.pointerId)return;it.x=ox+e.clientX-sx;it.y=oy+e.clientY-sy;el.style.left=it.x+'px';el.style.top=it.y+'px'};
 el.onpointerup=async e=>{if(pid===e.pointerId){pid=null;await put('items',it)}};
}
function resizable(h,el,it,dir){let sx,sy,o,pid=null;
 h.onpointerdown=e=>{e.preventDefault();e.stopPropagation();pid=e.pointerId;h.setPointerCapture(pid);sx=e.clientX;sy=e.clientY;o={x:it.x,y:it.y,w:it.w,h:it.h};select(el,it)};
 h.onpointermove=e=>{if(pid!==e.pointerId)return;const dx=e.clientX-sx,dy=e.clientY-sy,min=40;let{x,y,w,h:ht}=o;
  if(dir.includes('e'))w=o.w+dx;if(dir.includes('s'))ht=o.h+dy;
  if(dir.includes('w')){w=o.w-dx;x=o.x+dx}if(dir.includes('n')){ht=o.h-dy;y=o.y+dy}
  if(w<min){if(dir.includes('w'))x=o.x+o.w-min;w=min}if(ht<min){if(dir.includes('n'))y=o.y+o.h-min;ht=min}
  Object.assign(it,{x,y,w,h:ht});Object.assign(el.style,{left:x+'px',top:y+'px',width:w+'px',height:ht+'px'})};
 h.onpointerup=async e=>{if(pid===e.pointerId){pid=null;await put('items',it)}};
}
const place=blob=>put('items',{id:uid(),boardId:bd,blob,x:40,y:40,w:320,h:200});
async function addFromLibrary(){
 const ims=await getAll('images');if(!ims.length){alert('Your Image Library is empty.');return}
 const g=document.createElement('div');g.className='pickg';
 ims.forEach(i=>{const im=document.createElement('img');im.src=i.blob;im.title=i.name;im.onclick=()=>closeModal(i.id);g.appendChild(im)});
 const id=await modal('Add from Library','Click an image to place it on the board.',{body:g,noOk:1});
 const im=ims.find(x=>x.id===id);if(!im)return;
 await put('items',{id:uid(),boardId:bd,blob:im.blob,x:40,y:40,w:320,h:200,sourceImageId:im.id});renderStory();
}
async function pasteImage(){
 try{for(const ci of await navigator.clipboard.read())for(const t of ci.types)if(t.startsWith('image/')){await place(await toData(await ci.getType(t)));return renderStory()}
  alert('No image was found on the clipboard.')}
 catch(e){alert('Clipboard access was blocked. Press Ctrl/Cmd+V on the page instead.')}
}
async function removeSel(){if(!sel)return;await del('items',sel);sel=null;renderStory()}
$('#board').addEventListener('pointerdown',e=>{if(e.target.id==='board'){sel=null;document.querySelectorAll('.storyitem').forEach(x=>x.classList.remove('selected'))}});
document.addEventListener('keydown',e=>{if((e.key==='Delete'||e.key==='Backspace')&&!$('#storyView').hidden&&$('#modal').style.display!=='flex'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();removeSel()}});

/* ---------- wiring ---------- */
document.addEventListener('paste',async e=>{
 const files=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(!files.length)return;
 e.preventDefault();
 if($('#storyView').hidden)await importFiles(files);else{await place(await toData(files[0]));renderStory()}
});
$('#newFolder').onclick=()=>newFolder();
$('#addImagesBtn').onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=async e=>{try{if(e.target.files.length)await importFiles(e.target.files)}catch(err){console.error(err);alert('Could not import the selected images.')}finally{e.target.value=''}};
$('#search').oninput=()=>renderAll();
['#drop','#libraryMain'].forEach(s=>{const z=$(s);
 z.ondragover=e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();$('#drop').classList.add('drag')}};
 z.ondragleave=e=>{if(!z.contains(e.relatedTarget))$('#drop').classList.remove('drag')};
 z.ondrop=e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();$('#drop').classList.remove('drag');importFiles(e.dataTransfer.files)}};
});
let overEl=null;
document.addEventListener('dragover',e=>{const f=e.target.closest('[data-fid]');if(overEl)overEl.classList.remove('over');overEl=f;if(f&&!e.dataTransfer.types.includes('Files')){e.preventDefault();f.classList.add('over')}});
document.addEventListener('drop',e=>{const f=e.target.closest('[data-fid]'),id=e.dataTransfer.getData('text/plain');if(overEl)overEl.classList.remove('over');if(f&&id){e.preventDefault();moveDrop(id,f.dataset.fid)}});
$('#newBoard').onclick=async()=>{const n=await modal('New storyboard','Name your storyboard.',{input:1,initial:'Storyboard '+((await getAll('boards')).length+1)});if(n){const b={id:uid(),name:n,created:Date.now()};await put('boards',b);bd=b.id;sel=null;renderStory()}};
$('#addFromLibrary').onclick=addFromLibrary;$('#pasteStory').onclick=pasteImage;$('#removeSel').onclick=removeSel;

async function showView(v){
 const s=v==='storyboard';
 $('#ws').classList.toggle('story',s);
 $('#storyView').hidden=!s;$('#librarySide').hidden=s;$('#libraryMain').hidden=s;
 $('#libraryTab').classList.toggle('active',!s);$('#storyboardTab').classList.toggle('active',s);
 if(s)await renderStory();else await renderAll();
}
(async()=>{try{await openDB();await seed();await showView('library')}catch(e){console.error(e);alert('Frameboard could not open its storage. Try a different browser window (not private mode).')}})();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(console.error));</script>
